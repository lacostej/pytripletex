name: Refresh Tripletex OpenAPI spec

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch spec
        id: fetch
        run: |
          {
            echo 'summary<<EOF'
            scripts/update-openapi.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git diff --quiet -- spec/openapi.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add spec/openapi.json
          git commit -m "Refresh Tripletex OpenAPI spec" -m "$SUMMARY"
          git push
